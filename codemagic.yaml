workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    environment:
      vars:
        PACKAGE_NAME: "com.example.plantrenirovok"
      flutter: stable
      android_sdk: 34
    scripts:
      - name: Build Android
        script: |
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/debug/*.apk
